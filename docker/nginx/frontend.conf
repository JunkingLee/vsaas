server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/auth/ { proxy_pass http://auth:8001/api/auth/; include /etc/nginx/proxy_params_vsaas; }
    location /api/device/ { proxy_pass http://device:8002/api/device/; include /etc/nginx/proxy_params_vsaas; }
    location /api/channel/ { proxy_pass http://device:8002/api/channel/; include /etc/nginx/proxy_params_vsaas; }
    location /api/gb28181/ { proxy_pass http://device:8002/api/gb28181/; include /etc/nginx/proxy_params_vsaas; }
    location /api/wvp/ { proxy_pass http://device:8002/api/wvp/; include /etc/nginx/proxy_params_vsaas; }
    location /api/media/ { proxy_pass http://media:8003/api/media/; include /etc/nginx/proxy_params_vsaas; }
    location /api/tenant/ { proxy_pass http://tenant:8004/api/tenant/; include /etc/nginx/proxy_params_vsaas; }
    location /api/record/ { proxy_pass http://record:8005/api/record/; include /etc/nginx/proxy_params_vsaas; }
    location /api/srs/ { proxy_pass http://record:8005/api/srs/; include /etc/nginx/proxy_params_vsaas; }
    location /api/alarm/ { proxy_pass http://alarm:8006/api/alarm/; include /etc/nginx/proxy_params_vsaas; }
    location /api/billing/ { proxy_pass http://billing:8007/api/billing/; include /etc/nginx/proxy_params_vsaas; }
    location /api/user/ { proxy_pass http://user:8008/api/user/; include /etc/nginx/proxy_params_vsaas; }
    location /api/role/ { proxy_pass http://user:8008/api/role/; include /etc/nginx/proxy_params_vsaas; }
    location /api/menu/ { proxy_pass http://user:8008/api/menu/; include /etc/nginx/proxy_params_vsaas; }
    location /api/org/ { proxy_pass http://user:8008/api/org/; include /etc/nginx/proxy_params_vsaas; }
}
