services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vsaas
      POSTGRES_USER: vsaas
      POSTGRES_PASSWORD: vsaas123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  nacos:
    image: nacos/nacos-server:v2.3.2
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
  srs:
    image: ossrs/srs:5
    volumes:
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf
    ports:
      - "1935:1935"
      - "8080:8080"
      - "1985:1985"
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: vsaas
      RABBITMQ_DEFAULT_PASS: vsaas123
volumes:
  pgdata:
