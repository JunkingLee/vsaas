listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled     on;
        hls_path    ./objs/nginx/html;
        hls_fragment 2;
        hls_window   10;
    }
    dvr {
        enabled      on;
        dvr_path     ./objs/nginx/html/[app]/[stream].[timestamp].mp4;
        dvr_plan     segment;
        dvr_duration 3600;
        dvr_wait_keyframe on;
    }
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:8005/api/srs/on_publish;
        on_unpublish    http://host.docker.internal:8005/api/srs/on_unpublish;
        on_dvr          http://host.docker.internal:8005/api/srs/on_dvr;
    }
}
