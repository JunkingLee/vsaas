server:
  port: 8002

spring:
  application:
    name: vsaas-device
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vsaas}
    username: ${DB_USER:vsaas}
    password: ${DB_PASSWORD:vsaas123}
    driver-class-name: org.postgresql.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        fail-fast: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

vsaas:
  wvp:
    enabled: ${WVP_ENABLED:false}
    base-url: ${WVP_BASE_URL:http://127.0.0.1:18080}
  jwt:
    secret: ${VSAAS_JWT_SECRET:vsaas-jwt-secret-key-2026-please-change-it-to-very-long-string-at-least-32-bytes}
  device:
    heartbeat-timeout-seconds: 120
    offline-check-interval-ms: 30000
  alarm:
    report-url: ${ALARM_REPORT_URL:http://127.0.0.1:8006/api/alarm/report}

logging:
  level:
    com.vsaas: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
