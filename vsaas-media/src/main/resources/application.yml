server:
  port: 8003

spring:
  application:
    name: vsaas-media
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        fail-fast: false

vsaas:
  srs:
    http-host: ${SRS_HTTP_HOST:http://127.0.0.1:8080}
    api-host: ${SRS_API_HOST:http://127.0.0.1:1985}
    app: live
    webrtc-enabled: true
  jwt:
    secret: ${VSAAS_JWT_SECRET:vsaas-jwt-secret-key-2026-please-change-it-to-very-long-string-at-least-32-bytes}
  play:
    secret: ${VSAAS_PLAY_SECRET:vsaas-play-token-secret-change-me}
    expire-seconds: 3600

logging:
  level:
    com.vsaas: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
